name: Site quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check sitemap and search metadata
        run: python3 scripts/check-site.py
      - name: Validate search JavaScript syntax
        run: node --check assets/js/understand-search.js
      - name: Assemble self-contained website preview
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p preview
          cp *.html robots.txt sitemap.xml site.webmanifest preview/
          cp -R assets understand preview/
          cat > preview/OPEN_PREVIEW.txt <<'TXT'
          MEMBRANE HEALTH — PR WEBSITE PREVIEW

          1. Unzip this artifact.
          2. Double-click index.html to view the updated homepage in your browser.
          3. Click "Understand Health" in the top navigation to browse the new section.
          4. You can also open understand/index.html directly.

          No merge or deployment is necessary. This is a copy of the PR files.
          Most navigation, images, and page styling work locally. Some browser
          security settings can restrict scripts or external analytics under
          file://. For the most faithful preview, open a terminal in this folder,
          run: python3 -m http.server 8000
          then visit http://localhost:8000/ in a browser.
          Press Ctrl+C in the terminal to stop the server.
          TXT
      - name: Upload PR website preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: membrane-health-website-preview
          path: preview/
          if-no-files-found: error
          retention-days: 14
