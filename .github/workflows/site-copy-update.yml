name: One-time site copy update

on:
  push:
    paths:
      - '.github/workflows/site-copy-update.yml'

permissions:
  contents: write

jobs:
  patch-site-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply copy updates
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new))

          # -----------------------------------------------------------------
          # Homepage: release-state cleanup + scoped authority language.
          # -----------------------------------------------------------------
          replace('index.html', 'Coming August&nbsp;2026', 'Available now')
          replace('index.html', 'Join the August&nbsp;2026 launch', 'Explore Membrane')

          replace(
              'index.html',
              '<p class="sci-footnote"><span class="fn">*</span> <em>Formally proven</em> is not a statement of physiological truth or a disease diagnosis. What it does mean: our formal mathematical ontology of health stays stable, structured, auditable, and fully transparent — which is exactly what makes it reliable.</p>',
              '<p class="sci-footnote"><span class="fn">*</span> <em>Formally proven</em> is not a statement of physiological truth or a disease diagnosis. What it does mean: the formal mathematical ontology remains stable, structured, auditable, and transparent — so what the mathematics establishes, and what it does not establish, can be inspected directly.</p>'
          )

          replace(
              'index.html',
              '<p class="trust reveal">In closed beta since February&nbsp;2026 — with its model calibrated against real human physiology.</p>',
              '<p class="trust reveal">Live now — with human testing continuing as the measurement develops and its empirical history grows.</p>'
          )

          replace(
              'index.html',
              '<figcaption><strong>The best window to push</strong>When effort will actually land today — timing, made literal.</figcaption>',
              '<figcaption><strong>The best window to push</strong>The window your current physiology gives effort the clearest room to land.</figcaption>'
          )

          replace(
              'index.html',
              '<p class="lede">Available at launch, Membrane Health computes your whole-system state from the signals your Apple&nbsp;Watch already measures. The same mathematical foundation reaches a second scale — a research instrument that measures boundary response directly.</p><p class="subtle">A controlled pulse of light from your phone, and a map of how distributed parts of the body respond together, in phase — phase-coherence imaging. It\'s patent-pending, in research and development, and like everything here, it measures what is actually there, within a defined scope.</p>',
              '<p class="lede">Available now, Membrane Health computes your whole-system state from the signals your Apple&nbsp;Watch already measures. The same mathematical foundation reaches a second scale — a research instrument that measures boundary response directly.</p><p class="subtle">A controlled stimulus is delivered at an accessible boundary and the resulting response is witnessed across distributed measurement sites. The research program asks what those boundary responses can legitimately constrain about the larger physiological field, with measurement scope, provenance, and uncertainty kept explicit.</p>'
          )

          replace(
              'index.html',
              '<p class="plans__note muted center reveal">Your personal information remains yours, and Fieldflux does not sell it, to anyone. Sharing is yours to grant, and you decide what can be shared, with whom, and for how long. Every permission remains visible and controllable through Apple&nbsp;Health.</p>',
              '<p class="plans__note muted center reveal serif-italic"><strong>Membrane observes. You decide.</strong> A reading gives you a measured perspective on your physiology; how that information belongs in your experience and choices remains yours.</p><p class="plans__note muted center reveal">Your personal information remains yours, and Fieldflux does not sell it, to anyone. Sharing is yours to grant, and you decide what can be shared, with whom, and for how long. Every permission remains visible and controllable through Apple&nbsp;Health.</p>'
          )

          old_get = '<section class="section get" id="get"><div class="breath-glow get__glow" aria-hidden="true"></div><div class="wrap center get__inner"><p class="eyebrow reveal">Coming soon</p><h2 class="display get__h reveal">Find your edge.</h2><p class="lede reveal" style="margin-inline:auto;">Membrane Health is in closed beta now, with its calibration confirmed against real human physiology. It opens to everyone on launch day.</p><div class="release reveal"><span class="release__pill"><span class="glow-dot"></span>Worldwide release · August&nbsp;2026</span></div><form class="waitlist reveal" id="waitlist" action="https://mh-waitlist.fieldflux.workers.dev" method="post"><p class="waitlist__lead">Be first through the door.</p><div class="waitlist__row"><input class="waitlist__input" id="wl-email" type="email" name="email" placeholder="you@email.com" autocomplete="email" required aria-label="Your email address"><button class="btn btn--primary" type="submit">Notify me at launch</button></div><input class="waitlist__hp" type="text" name="hp_url" tabindex="-1" autocomplete="off" aria-hidden="true"><p class="waitlist__hint" role="alert" hidden></p><p class="waitlist__note muted">One email when we open in August&nbsp;2026 — that\'s all, and your address stays with us. <a href="privacy.html">Privacy</a>.</p></form><div class="waitlist__done" id="waitlist-done" tabindex="-1" hidden><span class="glow-dot"></span><p>You\'re on the list. Check your inbox to confirm — we\'ll see you on launch day.</p></div><p class="get__req muted reveal">For iPhone &amp; Apple&nbsp;Watch.</p></div></section>'
          new_get = '<section class="section get" id="get"><div class="breath-glow get__glow" aria-hidden="true"></div><div class="wrap center get__inner"><p class="eyebrow reveal">Live now</p><h2 class="display get__h reveal">Find your edge.</h2><p class="lede reveal" style="margin-inline:auto;">Membrane Health is available now. One whole-system reading from your Apple&nbsp;Watch brings today\'s load, capacity, mode, and recovery direction into a position you can follow through time.</p><div class="release reveal"><span class="release__pill"><span class="glow-dot"></span>Available now · iPhone &amp; Apple&nbsp;Watch</span></div><div class="hero__cta reveal" style="justify-content:center;margin-top:28px;"><a class="btn btn--primary" href="#home">See how the reading works</a><a class="btn btn--ghost" href="faq.html">Questions &amp; answers</a></div><p class="get__req muted reveal">Membrane observes. You decide.</p></div></section>'
          replace('index.html', old_get, new_get)

          # -----------------------------------------------------------------
          # Science: definition as perspective; formal and empirical authority
          # remain explicitly distinct; release state is current.
          # -----------------------------------------------------------------
          replace(
              'science.html',
              'How Membrane Health works, from the human idea to the mathematics — health as organized continuity under changing load, read as a position in a formally defined state space. The computation and the proofs live at Fieldflux Biosystems.',
              'How Membrane Health works from a precise definition to formal mathematics, measurement, and empirical testing — a perspective on health that can be inspected, measured, challenged, and revised through experience.'
          )

          replace(
              'science.html',
              'From the human idea to the mathematics: health as organized continuity under changing load, read against a formally defined state space.',
              'From a precise definition to formal mathematics and empirical encounter: a perspective on health built to be inspected, measured, tested, and revised.'
          )

          replace('science.html', 'Coming Aug&nbsp;10', 'Available now')

          replace(
              'science.html',
              '<p class="eyebrow">Layer 1 · The human idea</p>\n            <h2 class="h-section">Health is organized continuity under changing load.</h2>\n            <p class="lede">\n              A living system stays itself by organizing what arrives and preserving enough continuity\n              for adaptation, exchange, and recovery to continue as conditions change.\n            </p>\n            <p class="subtle">\n              A cell holds its shape through a membrane that regulates exchange across a living boundary,\n              and our bodies express the same principle at larger scales of organization. Membrane Health\n              reads how that organization is holding today and how much capacity remains within its\n              current boundary.\n            </p>',
              '<p class="eyebrow">Layer 1 · The perspective</p>\n            <h2 class="h-section">We begin with a definition of health.</h2>\n            <p class="lede">\n              We approach health as the condition and capacity by which a living relational field preserves\n              sufficient coherence to remain distinguishable while participating in the exchanges and changing\n              conditions that constitute it.\n            </p>\n            <p class="subtle">\n              The definition is a disciplined perspective, not an oracle. It gives us somewhere precise to look: a\n              question about health can become a question that can be formalized, measured, tested, and revised\n              through experience. <strong>A definition gives us somewhere precise to look. Experience tells us what we find there.</strong>\n            </p>'
          )

          replace(
              'science.html',
              '<p class="lede">\n              Underneath the daily reading is a formal state space with defined bounds, relationships\n              that unfold through time, and a defined region of health.\n            </p>',
              '<p class="lede">\n              Once the definition is chosen, it can be made exact: a formal state space with defined bounds,\n              quantities, relations, and a region in which the claims of the model can be tested. Formalization\n              does not make the definition physically true; it makes the definition precise enough to interrogate.\n            </p>'
          )

          replace(
              'science.html',
              'Each reading locates today\'s state within the mathematical structure of health and within the movement of your own physiology through time.',
              'Each reading locates today\'s state within that formal structure and within the movement of your own physiology through time.'
          )

          replace(
              'science.html',
              '<p class="eyebrow">Layers 3 &amp; 4 · at Fieldflux Biosystems</p>\n            <h2 class="h-section">The computation, and the proof.</h2>\n            <p class="lede">\n              The definition itself, the machine-checked corpus, and how the proofs can be independently\n              verified live at <strong>Fieldflux&nbsp;Biosystems</strong> — the company behind Membrane Health.\n            </p>',
              '<p class="eyebrow">Layers 3 &amp; 4 · formal structure and empirical encounter</p>\n            <h2 class="h-section">Proof tells us what follows. Measurement tells us what we encounter.</h2>\n            <p class="lede">\n              The machine-checked corpus establishes what follows inside the formal system. Measurement and\n              physiological testing ask how, where, and whether those formal relationships correspond with living\n              physiology. The two forms of authority remain distinct, and the bridge between them is evidence.\n            </p>'
          )

          replace(
              'science.html',
              'Formal proof establishes specified properties of the mathematical system, while physiological testing establishes how the resulting measurements behave in people. Together, they give each reading an evidence base, a defined scope, and a growing empirical history.',
              'Formal proof establishes specified properties of the mathematical system; physiological testing establishes how the resulting measurements behave in people. Proof does not substitute for physiological validation, and experience does not rewrite a theorem. Keeping those authorities distinct gives each reading a defined scope, an inspectable basis, and a growing empirical history.'
          )

          old_science_get = '<p class="eyebrow reveal">Coming soon</p>\n        <h2 class="display get__h reveal">Read your own state.</h2>\n        <p class="lede reveal" style="margin-inline:auto;">Membrane Health opens to everyone on launch day. One whole-system reading from your Apple&nbsp;Watch — go, caution, or recover.</p>\n        <div class="release reveal">\n          <span class="release__pill"><span class="glow-dot"></span>Worldwide release · August&nbsp;10, 2026</span>\n        </div>\n        <div class="hero__cta reveal" style="justify-content:center;margin-top:28px;">\n          <a class="btn btn--primary" href="index.html#get">Join the launch</a>\n          <a class="btn btn--ghost" href="index.html#home">See how the reading works</a>\n        </div>'
          new_science_get = '<p class="eyebrow reveal">Live now</p>\n        <h2 class="display get__h reveal">Read your own state.</h2>\n        <p class="lede reveal" style="margin-inline:auto;">Membrane Health is available now. One whole-system reading from your Apple&nbsp;Watch — go, caution, or recover — with the measurements and relationships that formed it still attached.</p>\n        <div class="release reveal">\n          <span class="release__pill"><span class="glow-dot"></span>Available now · iPhone &amp; Apple&nbsp;Watch</span>\n        </div>\n        <div class="hero__cta reveal" style="justify-content:center;margin-top:28px;">\n          <a class="btn btn--primary" href="index.html#home">See how the reading works</a>\n          <a class="btn btn--ghost" href="faq.html">Questions &amp; answers</a>\n        </div>'
          replace('science.html', old_science_get, new_science_get)

          # Legal pages: release-state navigation only; legal substance stays untouched.
          replace('terms.html', 'Coming Aug&nbsp;10', 'Available now')

          # Remove this one-shot workflow after the patch lands.
          Path('.github/workflows/site-copy-update.yml').unlink()

      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html science.html terms.html .github/workflows/site-copy-update.yml
          git commit -m "Update site copy for live release and scoped measurement stance"
          git push origin main
