name: Final copy refinement

on:
  push:
    paths:
      - '.github/workflows/final-copy-refine.yml'

permissions:
  contents: write

jobs:
  refine-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply copy refinements
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old[:140]!r}')
              p.write_text(text.replace(old, new))

          # ---------------------------------------------------------------
          # Site-wide release label: explicit App Store availability.
          # ---------------------------------------------------------------
          for filename in ['index.html', 'science.html', 'about.html', 'faq.html', 'privacy.html', 'terms.html']:
              p = Path(filename)
              text = p.read_text()
              text = re.sub(
                  r'(<a class="btn btn--primary btn--sm"[^>]*>)Available now(</a>)',
                  r'\1Available now in the App Store\2',
                  text
              )
              p.write_text(text)

          # Homepage hero: useful destination CTAs.
          replace(
              'index.html',
              '<div class="hero__cta reveal"><a class="btn btn--primary" href="#get">Explore Membrane</a><a class="btn btn--ghost" href="#home">See how the reading works</a></div>',
              '<div class="hero__cta reveal"><a class="btn btn--primary" href="science.html">See the Science</a><a class="btn btn--ghost" href="#plans">Pricing</a></div>'
          )

          # Homepage release block: explicit App Store availability + useful CTAs.
          replace(
              'index.html',
              'Membrane Health is available now. One whole-system reading from your Apple&nbsp;Watch brings today\'s load, capacity, mode, and recovery direction into a position you can follow through time.',
              'Membrane Health is available now in the App Store. One whole-system reading from your Apple&nbsp;Watch brings today\'s load, capacity, mode, and recovery direction into a position you can follow through time.'
          )
          replace(
              'index.html',
              'Available now · iPhone &amp; Apple&nbsp;Watch',
              'Available now in the App Store · iPhone &amp; Apple&nbsp;Watch'
          )
          replace(
              'index.html',
              '<div class="hero__cta reveal" style="justify-content:center;margin-top:28px;"><a class="btn btn--primary" href="#home">See how the reading works</a><a class="btn btn--ghost" href="faq.html">Questions &amp; answers</a></div>',
              '<div class="hero__cta reveal" style="justify-content:center;margin-top:28px;"><a class="btn btn--primary" href="science.html">See the Science</a><a class="btn btn--ghost" href="#plans">Pricing</a></div>'
          )

          # Science release language.
          replace(
              'science.html',
              'Membrane Health is available now. One whole-system reading from your Apple&nbsp;Watch — go, caution, or recover — with the measurements and relationships that formed it still attached.',
              'Membrane Health is available now in the App Store. One whole-system reading from your Apple&nbsp;Watch — go, caution, or recover — with the measurements and relationships that formed it still attached.'
          )
          replace(
              'science.html',
              'Available now · iPhone &amp; Apple&nbsp;Watch',
              'Available now in the App Store · iPhone &amp; Apple&nbsp;Watch'
          )

          # ---------------------------------------------------------------
          # Science copy: keep the concepts, remove antithetical construction.
          # ---------------------------------------------------------------
          replace(
              'science.html',
              'The definition is a disciplined perspective, not an oracle. It gives us somewhere precise to look: a\n              question about health can become a question that can be formalized, measured, tested, and revised\n              through experience. <strong>A definition gives us somewhere precise to look. Experience tells us what we find there.</strong>',
              'The definition gives us a disciplined perspective and somewhere precise to look. A question about\n              health can become a question that can be formalized, measured, tested, and revised through\n              experience. <strong>A definition gives us somewhere precise to look. Experience tells us what we find there.</strong>'
          )

          replace(
              'science.html',
              'Once the definition is chosen, it can be made exact: a formal state space with defined bounds,\n              quantities, relations, and a region in which the claims of the model can be tested. Formalization\n              does not make the definition physically true; it makes the definition precise enough to interrogate.',
              'Once the definition is chosen, it can be made exact: a formal state space with defined bounds,\n              quantities, relations, and a region in which the claims of the model can be tested. Formalization\n              makes the definition precise enough to interrogate, derive consequences from, and bring into contact with measurement.'
          )

          replace(
              'science.html',
              'The machine-checked corpus establishes what follows inside the formal system. Measurement and\n              physiological testing ask how, where, and whether those formal relationships correspond with living\n              physiology. The two forms of authority remain distinct, and the bridge between them is evidence.',
              'The machine-checked corpus establishes what follows inside the formal system. Measurement and\n              physiological testing examine how, where, and under what conditions those formal relationships correspond\n              with living physiology. Evidence relates these forms of authority while preserving the scope of each.'
          )

          replace(
              'science.html',
              'Formal proof establishes specified properties of the mathematical system; physiological testing establishes how the resulting measurements behave in people. Proof does not substitute for physiological validation, and experience does not rewrite a theorem. Keeping those authorities distinct gives each reading a defined scope, an inspectable basis, and a growing empirical history.',
              'Formal proof establishes specified properties of the mathematical system; physiological testing establishes how the resulting measurements behave in people. Each carries its own authority and scope, and their relationship gives each reading a defined scope, an inspectable basis, and a growing empirical history.'
          )

          # Remove this one-shot workflow after successful patch.
          Path('.github/workflows/final-copy-refine.yml').unlink()

      - name: Commit refined copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html science.html about.html faq.html privacy.html terms.html .github/workflows/final-copy-refine.yml
          git commit -m "Refine release CTAs and science voice"
          git push origin main
